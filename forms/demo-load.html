<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Load Demo Data — GetCarrieAI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    p { font-size: 0.92rem; color: #6b7280; line-height: 1.6; max-width: 360px; margin-bottom: 28px; }
    .btn {
      padding: 14px 32px; background: #8B2FC9; color: #fff;
      border: none; border-radius: 32px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background 0.2s; margin-bottom: 12px; display: block;
    }
    .btn:hover { background: #6b1fa0; }
    .btn-clear { background: none; border: 1.5px solid #e5e7eb; color: #6b7280; border-radius: 32px; padding: 10px 24px; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-clear:hover { border-color: #ef4444; color: #ef4444; }
    .note { font-size: 0.78rem; color: #9ca3af; margin-top: 20px; }
  </style>
</head>
<body>
  <p class="eyebrow">GetCarrieAI — Demo</p>
  <h1>Load demo data</h1>
  <p>Populates all 5 kit sections with a fictional exec (Marcus Chen, CEO) so you can demo the full briefing flow.</p>
  <button class="btn" onclick="loadDemo()">Load demo data → open kit</button>
  <button class="btn-clear" onclick="clearDemo()">Clear demo data</button>

- David Park (Sequoia, lead investor) — quarterly board meetings + monthly check-ins

- Board meetings: quarterly, always in-person in San Francisco`);

    localStorage.setItem('gcai_kit_travel', `HOME AIRPORT: SFO

- International: minimum 3 weeks notice, always verify visa requirements`);

    localStorage.setItem('gcai_kit_food', `DAILY ORDERS
- Morning coffee: oat milk latte, extra shot, no sugar
  Starbucks: "Venti oat latte, triple shot, no sweetener"

- Team lunches: Sweetgreen, Chipotle — always include a vegetarian option
- Always provide: still water, sparkling water, non-dairy milk for coffee

FAVORITE RESTAURANTS (SF)
- Zuni Café — go-to for business lunches
- Gary Danko — board dinners and special occasions
- Cotogna — casual, good for team dinners
- Bix — cocktails and client entertaining

BOOKING NOTES
- Always request a quiet table
- OpenTable name: Marcus Chen
- Groups over 4: call ahead to confirm`);

    localStorage.setItem('gcai_kit_household', `Here is everything you need to know about Marcus Chen's household.

FAMILY
- Wife: Sarah Chen — high school history teacher, summers off. Primary contact for all personal coordination.
- Daughter: Emma Chen, 14 — freshman at Palo Alto High. Soccer on Saturdays. Birthday: July 12.

- Wedding anniversary: September 15.

- Landscaper: Green Thumb Co. — bi-weekly, Tuesday mornings

    window.location.href = 'kit.html';
  }

  function clearDemo() {
    ['executive','team','travel','food','household'].forEach(k => localStorage.removeItem('gcai_kit_' + k));
    alert('Demo data cleared.');
  }
</script>
</body>
</html>
