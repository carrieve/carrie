<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GetCarrieAI — Train Your AI Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #8B2FC9;
      --purple-light: #f3e8ff;
      --purple-dark: #6b1fa0;
      --black: #111111;
      --gray: #6b7280;
      --border: #e5e7eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: #fff;
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 80px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .top-bar {
      width: 100%;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-weight: 700; font-size: 1rem; color: var(--purple); text-decoration: none; }
    .progress-wrap { display: flex; align-items: center; gap: 10px; }
    .progress-bar {
      width: 120px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--purple);
      border-radius: 2px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-label { font-size: 0.78rem; color: var(--gray); }

    /* ── Main ── */
    .main {
      width: 100%;
      max-width: 560px;
      padding: 48px 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-sm {
      width: 72px; height: 72px;
      object-fit: contain;
      margin-bottom: 24px;
    }
    .avatar-sm.speaking { animation: pulse 0.8s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.07); } }

    /* ── Question card ── */
    .card {
      width: 100%;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .carrie-msg {
      background: var(--purple-light);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 16px 20px;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--black);
      margin-bottom: 20px;
    }

    .ack {
      font-size: 0.92rem;
      color: var(--gray);
      margin-bottom: 16px;
      font-style: italic;
    }

    /* ── Tap buttons ── */
    .tap-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tap-btn {
      padding: 10px 18px;
      border: 2px solid var(--border);
      border-radius: 24px;
      background: #fff;
      font-size: 0.92rem;
      cursor: pointer;
      font-family: inherit;
      color: var(--black);
      transition: border-color 0.15s, background 0.15s;
    }
    .tap-btn:hover { border-color: var(--purple); }
    .tap-btn.selected { border-color: var(--purple); background: var(--purple-light); color: var(--purple); font-weight: 600; }

    /* ── Text input ── */
    .text-input-wrap {
      width: 100%;
      position: relative;
      margin-bottom: 20px;
    }
    .text-input-wrap input, .text-input-wrap textarea {
      width: 100%;
      padding: 13px 50px 13px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-size: 0.97rem;
      font-family: inherit;
      outline: none;
      resize: none;
      color: var(--black);
      transition: border-color 0.2s;
    }
    .text-input-wrap input:focus, .text-input-wrap textarea:focus { border-color: var(--purple); }
    .input-mic {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray);
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
    }
    .input-mic.active { color: var(--purple); background: var(--purple-light); }
    .text-input-wrap textarea { padding-right: 50px; min-height: 90px; }
    .textarea-mic { top: 14px; transform: none; }

    /* ── Nav buttons ── */
    .nav-row {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 8px;
    }
    .btn-next {
      flex: 1;
      padding: 14px;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-next:hover { background: var(--purple-dark); }
    .btn-next:disabled { background: #d1d5db; cursor: not-allowed; }
    .btn-skip {
      padding: 14px 20px;
      background: none;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-size: 0.9rem;
      color: var(--gray);
      cursor: pointer;
      font-family: inherit;
    }
    .btn-skip:hover { border-color: var(--gray); }

    /* ── Category complete ── */
    .cat-complete {
      background: var(--purple-light);
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    .cat-complete p { color: var(--black); line-height: 1.6; margin-bottom: 16px; }
    .cat-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .cat-btn {
      padding: 10px 18px;
      border: 2px solid var(--purple);
      border-radius: 24px;
      background: #fff;
      color: var(--purple);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .cat-btn:hover { background: var(--purple-light); }
    .cat-btn.done-btn { background: var(--purple); color: #fff; }

    /* ── Nudge ── */
    .nudge {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.88rem;
      color: #92400e;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* ── Typing indicator ── */
    .typing {
      display: flex; gap: 5px; padding: 10px 0;
    }
    .typing span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--purple);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="logo">GetCarrieAI</a>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-label" id="progress-label">Let's get started</span>
  </div>
</div>

<div class="main">
  <div class="card" id="card"></div>
</div>

<script>
// ── Voice input ──
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let activeMic = null;

if (SR) {
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
}

function startMic(textarea, micBtn) {
  if (!recognition) return;
  if (activeMic && activeMic !== micBtn) stopMic();
  activeMic = micBtn;
  micBtn.classList.add('active');
  recognition.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
    textarea.value = transcript;
    autoGrow(textarea);
  };
  recognition.onend = () => { micBtn.classList.remove('active'); activeMic = null; };
  recognition.onerror = () => { micBtn.classList.remove('active'); activeMic = null; };
  recognition.start();
}

function stopMic() {
  if (recognition) recognition.stop();
  if (activeMic) { activeMic.classList.remove('active'); activeMic = null; }
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 320) + 'px';
}

function setProgress(pct, label) {
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = label;
}

// ── API call ──
async function callAI(systemPrompt, userMessage, maxTokens) {
  const res = await fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system: systemPrompt,
      max_tokens: maxTokens || 1024,
      messages: [{ role: 'user', content: userMessage }]
    })
  });
  const data = await res.json();
  if (!data.content) throw new Error(data.error || 'API error');
  return data.content;
}

function showTyping() {
  const card = document.getElementById('card');
  const t = document.createElement('div');
  t.className = 'typing'; t.id = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  card.appendChild(t);
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

// ── State ──
let brainDump = '';
let followUpQuestions = [];
let followUpAnswers = [];
let currentQ = 0;

// ── Screen 1: Brain dump ──
function showBrainDump() {
  setProgress(10, 'Step 1 of 3');
  const card = document.getElementById('card');
  card.innerHTML = '';

  const msg = document.createElement('div');
  msg.className = 'carrie-msg';
  msg.innerHTML = "Tell me everything — who you are, what you do, who you support, how you like to work, and what drives you crazy. The more you share, the better your AI will know you.<br><br><strong>Type it out or tap the mic and just talk. Whatever's easier.</strong>";
  card.appendChild(msg);

  const wrap = document.createElement('div');
  wrap.className = 'text-input-wrap';

  const ta = document.createElement('textarea');
  ta.placeholder = isWorkMode
    ? "e.g. I'm an EA supporting a Series B founder in NYC. She travels every other week, flies Delta, always needs an aisle seat. I manage her calendar, inbox, expenses, and board prep. She hates back-to-back meetings and never wants to be the one to send the follow-up. I draft most of her emails and I need them to sound exactly like her. We use Google Workspace, Slack, and Notion. My biggest pain is scheduling across time zones and getting her to respond to things before the deadline..."
    : "e.g. I'm Carrie AI — EA at a tech startup, mom of two kids (8 and 11), two dogs, and I'm also managing eldercare for my mother-in-law who lives nearby. Work side: I support a founder, lots of travel, I need to book a trip to Santa Monica next week. Home side: school pickups, vet appointments, grocery orders, and making sure my mother-in-law gets to her doctor. I'm the person everyone calls when something needs to get done — and I never have enough hours.";
  ta.rows = 6;
  ta.style.minHeight = '160px';
  ta.addEventListener('input', () => autoGrow(ta));
  wrap.appendChild(ta);

  if (SR) {
    const mic = document.createElement('button');
    mic.className = 'input-mic textarea-mic';
    mic.title = 'Tap to talk';
    mic.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
    mic.addEventListener('click', () => {
      if (mic.classList.contains('active')) stopMic();
      else startMic(ta, mic);
    });
    wrap.appendChild(mic);
  }

  card.appendChild(wrap);

  const btn = document.createElement('button');
  btn.className = 'btn-next';
  btn.textContent = 'Train my AI →';
  btn.addEventListener('click', () => {
    const text = ta.value.trim();
    if (!text || text.length < 20) {
      ta.style.borderColor = 'var(--purple)';
      ta.placeholder = 'Please tell me a bit more — the more detail, the better your prompt.';
      return;
    }
    stopMic();
    brainDump = text;
    generateFollowUps();
  });
  card.appendChild(btn);
}

// ── Step 2: Generate follow-up questions ──
async function generateFollowUps() {
  setProgress(40, 'Reading your info...');
  const card = document.getElementById('card');
  card.innerHTML = '';

  const msg = document.createElement('div');
  msg.className = 'carrie-msg';
  msg.textContent = "Got it — reading what you shared...";
  card.appendChild(msg);
  showTyping();

  const systemPrompt = `You are helping someone set up a personal AI assistant system prompt. 
They have written a brain dump about themselves. 
Your job is to read it and ask 3 to 5 smart follow-up questions that will make their AI assistant significantly more useful.

Rules:
- Reference specific things they mentioned
- Ask about important gaps (things that would help an AI assist them but are missing)
- Keep questions short and conversational
- Return ONLY a valid JSON array of question strings, nothing else
- Example format: ["Question one?", "Question two?", "Question three?"]`;

  try {
    const raw = await callAI(systemPrompt, brainDump, 512);
    const match = raw.match(/\[.*\]/s);
    if (!match) throw new Error('No JSON found');
    followUpQuestions = JSON.parse(match[0]);
    hideTyping();
    showFollowUp(0);
  } catch(e) {
    hideTyping();
    followUpQuestions = [
      "What's your name?",
      "What's the one task you wish your AI could just handle for you?",
      "How do you prefer to communicate — formal or casual?"
    ];
    showFollowUp(0);
  }
}

// ── Step 3: Follow-up questions one at a time ──
function showFollowUp(index) {
  if (index >= followUpQuestions.length) {
    generatePrompt();
    return;
  }

  currentQ = index;
  const total = followUpQuestions.length;
  setProgress(40 + Math.round((index / total) * 30), `Question ${index + 1} of ${total}`);

  const card = document.getElementById('card');
  card.innerHTML = '';

  const msg = document.createElement('div');
  msg.className = 'carrie-msg';
  msg.textContent = followUpQuestions[index];
  card.appendChild(msg);

  const wrap = document.createElement('div');
  wrap.className = 'text-input-wrap';

  const ta = document.createElement('textarea');
  ta.placeholder = 'Type or tap the mic...';
  ta.rows = 3;
  ta.addEventListener('input', () => autoGrow(ta));
  wrap.appendChild(ta);

  if (SR) {
    const mic = document.createElement('button');
    mic.className = 'input-mic textarea-mic';
    mic.title = 'Tap to talk';
    mic.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
    mic.addEventListener('click', () => {
      if (mic.classList.contains('active')) stopMic();
      else startMic(ta, mic);
    });
    wrap.appendChild(mic);
  }

  card.appendChild(wrap);

  const navRow = document.createElement('div');
  navRow.className = 'nav-row';

  const btn = document.createElement('button');
  btn.className = 'btn-next';
  btn.textContent = index < total - 1 ? 'Next →' : 'Generate my prompt →';
  btn.addEventListener('click', () => {
    stopMic();
    followUpAnswers[index] = ta.value.trim() || '(skipped)';
    showFollowUp(index + 1);
  });

  const skip = document.createElement('button');
  skip.className = 'btn-skip';
  skip.textContent = 'Skip';
  skip.addEventListener('click', () => {
    stopMic();
    followUpAnswers[index] = '(skipped)';
    showFollowUp(index + 1);
  });

  navRow.appendChild(btn);
  navRow.appendChild(skip);
  card.appendChild(navRow);
}

// ── Step 4: Generate final system prompt ──
async function generatePrompt() {
  setProgress(80, 'Building your prompt...');
  const card = document.getElementById('card');
  card.innerHTML = '';

  const msg = document.createElement('div');
  msg.className = 'carrie-msg';
  msg.textContent = "Almost there — generating your personal AI prompt...";
  card.appendChild(msg);
  showTyping();

  const qaContext = followUpQuestions.map((q, i) =>
    `Q: ${q}\nA: ${followUpAnswers[i] || '(skipped)'}`
  ).join('\n\n');

  const userContent = `Brain dump:\n${brainDump}\n\nFollow-up answers:\n${qaContext}`;

  const systemPrompt = `You are generating a personal AI assistant system prompt for someone based on their brain dump and answers to follow-up questions.

The system prompt you write will be pasted directly into Claude, ChatGPT, or Gemini. It should make that AI act as their personal assistant who already knows everything about them.

Format requirements:
- Start with this block exactly:
  "CRITICAL INSTRUCTIONS — READ BEFORE EVERY RESPONSE:
  You have a detailed profile about me in these instructions. Use it every time.
  - Never ask me questions already answered in my profile
  - Never ask who I'm with — you know my family situation
  - Never ask where I'm from — you know my location
  - When I mention a person by relationship (spouse, mother-in-law, kids) — connect it immediately to who that person is in my profile
  - When I mention travel — immediately ask about pets, house coverage, and anyone who needs to know
  - Start every response from what you already know. Only ask what is genuinely new information."
  Then: "You are my personal AI executive assistant."
- Use ## headers for sections (About Me, Work & Role, Communication Style, Travel Preferences, etc.) — only include sections where you have real info
- Be specific — use the actual details they shared, not generic placeholders
- End with a "## How to Help Me" section with 4-6 behavioral guidelines
- Always include a "## Proactive EA Behaviors" section with specific triggers based on what they shared. Examples: "When I mention travel, ask about pet care, house coverage, and out of office. When a date or occasion comes up, ask if a gift or reservation is needed. When I mention a meeting, check if a calendar invite has been sent and if there are pre-reads. Flag action items without owners or deadlines. Anticipate what I might have forgotten, not just what I asked for."
- Write in first person as if the user is giving instructions to their AI
- Do not include any meta-commentary, just the prompt itself
- Aim for thorough but scannable — around 400-600 words`;

  try {
    const prompt = await callAI(systemPrompt, userContent, 2048);
    hideTyping();
    showResult(prompt);
  } catch(e) {
    hideTyping();
    const card2 = document.getElementById('card');
    card2.innerHTML = '<div class="carrie-msg">Something went wrong generating your prompt. Please try again.</div>';
    const retry = document.createElement('button');
    retry.className = 'btn-next';
    retry.textContent = 'Try again';
    retry.addEventListener('click', generatePrompt);
    card2.appendChild(retry);
  }
}

// ── Step 5: Show result ──
function showResult(prompt) {
  setProgress(100, 'Done!');
  localStorage.setItem('carrieProfile', JSON.stringify({ prompt, created: new Date().toISOString() }));

  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="carrie-msg">Your prompt is ready! Here's exactly what to do with it.</div>

    <!-- Step 1: Copy -->
    <div style="margin-top:20px;background:#f0fdf4;border:2px solid #86efac;border-radius:16px;padding:20px;">
      <p style="font-weight:700;font-size:0.95rem;margin-bottom:12px;">✅ Step 1 — Copy your prompt</p>
      <div style="position:relative;">
        <textarea id="prompt-output" readonly style="
          width:100%;min-height:200px;padding:12px;
          border:1px solid var(--border);border-radius:12px;
          font-size:0.78rem;line-height:1.6;font-family:monospace;
          background:#fff;color:var(--black);resize:vertical;outline:none;
        ">${escapeHtml(prompt)}</textarea>
      </div>
      <button onclick="copyPrompt()" id="copy-btn" style="
        display:block;width:100%;margin-top:12px;
        padding:14px;background:#16a34a;color:#fff;
        border:none;border-radius:12px;font-size:1rem;
        font-weight:700;cursor:pointer;font-family:inherit;
      ">📋 Copy my prompt</button>
    </div>

    <!-- Step 2: Paste -->
    <div style="margin-top:16px;border:2px solid var(--border);border-radius:16px;padding:20px;">
      <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px 16px;margin-bottom:16px;">
        <p style="font-size:0.85rem;font-weight:700;color:#92400e;margin-bottom:4px;">💡 If your AI still feels generic after pasting</p>
        <p style="font-size:0.83rem;color:#78350f;line-height:1.6;">Add this line at the very top of your instructions:<br><strong>"You already know me. Never ask me questions you can answer from my profile. Lead with what you know and only ask what's genuinely missing."</strong></p>
      </div>
      <p style="font-weight:700;font-size:0.95rem;margin-bottom:16px;">📌 Step 2 — Paste it into your AI</p>

      <div style="margin-bottom:14px;padding:14px;background:#f9fafb;border-radius:12px;">
        <p style="font-weight:700;font-size:0.88rem;margin-bottom:6px;">🟣 Claude (recommended — best results)</p>
        <ol style="font-size:0.85rem;line-height:1.9;color:#374151;padding-left:18px;">
          <li>Go to <a href="https://claude.ai" target="_blank" style="color:var(--purple);">claude.ai</a> — free account works</li>
          <li>Click <strong>Projects</strong> in the left sidebar</li>
          <li>Click <strong>New Project</strong></li>
          <li>Click <strong>Project instructions</strong> and paste</li>
          <li>Start a new chat — Carrie already knows you</li>
        </ol>
      </div>

      <div style="margin-bottom:14px;padding:14px;background:#f9fafb;border-radius:12px;">
        <p style="font-weight:700;font-size:0.88rem;margin-bottom:6px;">💬 ChatGPT</p>
        <ol style="font-size:0.85rem;line-height:1.9;color:#374151;padding-left:18px;">
          <li>Go to <a href="https://chatgpt.com" target="_blank" style="color:var(--purple);">chatgpt.com</a></li>
          <li>Click your profile → <strong>Settings</strong></li>
          <li>Click <strong>Personalization → Custom instructions</strong></li>
          <li>Paste in the bottom box and save</li>
        </ol>
      </div>

      <div style="padding:14px;background:#f9fafb;border-radius:12px;">
        <p style="font-weight:700;font-size:0.88rem;margin-bottom:6px;">✨ Gemini</p>
        <ol style="font-size:0.85rem;line-height:1.9;color:#374151;padding-left:18px;">
          <li>Go to <a href="https://gemini.google.com" target="_blank" style="color:var(--purple);">gemini.google.com</a></li>
          <li>Open a new chat</li>
          <li>Type: <em>"Use these instructions for all our conversations:"</em></li>
          <li>Paste your prompt and hit send</li>
        </ol>
      </div>
    </div>

      <div style="padding:14px;background:#f9fafb;border-radius:12px;margin-top:14px;">
        <p style="font-weight:700;font-size:0.88rem;margin-bottom:6px;">⚡ Grok</p>
        <ol style="font-size:0.85rem;line-height:1.9;color:#374151;padding-left:18px;">
          <li>Go to <a href="https://grok.com" target="_blank" style="color:var(--purple);">grok.com</a></li>
          <li>Open a new chat</li>
          <li>Type: <em>"Use these instructions for all our conversations:"</em></li>
          <li>Paste your prompt and hit send</li>
        </ol>
      </div>
    </div>

    <button onclick="showBrainDump()" style="

function copyPrompt() {

  navigator.clipboard.writeText(ta.value).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.style.background = '#16a34a';
    setTimeout(() => { btn.textContent = 'Copy'; btn.style.background = 'var(--purple)'; }, 2000);
  }).catch(() => { ta.select(); document.execCommand('copy'); });
}
