<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write a Job Posting — GetCarrieAI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #8B2FC9;
      --purple-light: #f3e8ff;
      --purple-dark: #6b1fa0;
      --black: #111111;
      --gray: #6b7280;
      --border: #e5e7eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: #fff;
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 80px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 620px; width: 100%; }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-weight: 700; font-size: 1rem; color: var(--purple); text-decoration: none; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; }
    .subtitle { font-size: 0.95rem; color: var(--gray); line-height: 1.6; margin-bottom: 32px; }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    textarea, input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--black);
      outline: none;
      transition: border-color 0.15s;
      background: #fff;
      line-height: 1.6;
    }
    textarea:focus, input:focus { border-color: var(--purple); }
    textarea { resize: vertical; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .row-2 { grid-template-columns: 1fr; } }

    .btn-generate {
      width: 100%;
      padding: 16px;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
      margin-top: 20px;
    }
    .btn-generate:hover { background: var(--purple-dark); }
    .btn-generate:disabled { background: #d1d5db; cursor: not-allowed; }

    /* Loading */
    .loading { display: none; text-align: center; padding: 48px 20px; }
    .loading.visible { display: block; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--purple-light);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--gray); font-size: 0.92rem; }

    /* Output */
    .output-section { display: none; }
    .output-section.visible { display: block; }

    .output-box {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--black);
      margin-bottom: 16px;
    }

    .output-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .btn-copy, .btn-reset, .btn-print {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      border: none;
      transition: all 0.15s;
      min-width: 100px;
    }
    .btn-copy { background: var(--purple); color: #fff; }
    .btn-copy:hover { background: var(--purple-dark); }
    .btn-copy.copied { background: #16a34a; }
    .btn-print { background: var(--purple-light); color: var(--purple); border: 1px solid #ddd6fe; }
    .btn-print:hover { background: #ede9fe; }
    .btn-reset { background: #f3f4f6; color: var(--black); border: 1px solid var(--border); }
    .btn-reset:hover { background: #e5e7eb; }

    .back-link { text-align: center; margin-top: 28px; font-size: 0.85rem; }
    .back-link a { color: var(--purple); text-decoration: none; }

    @media print {
      body { background: #fff; padding: 20px; }
      .output-section.visible { display: block !important; }
      .card, .back-link, .output-actions, .top-bar { display: none !important; }
      .output-box { border: none; padding: 0; background: #fff; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <a href="index.html" class="logo">GetCarrieAI</a>
  </div>

  <h1>💼 Write a Job Posting</h1>
  <p class="subtitle">Tell me about the role — AI writes a polished posting ready for LinkedIn, Indeed, or your careers page.</p>

  <div class="card" id="input-card">
    <div class="field">
      <label>Describe the role</label>
      <textarea id="brain-dump" rows="7" placeholder="e.g. We're hiring an Executive Assistant for our Series B startup in NYC. The CEO is a fast-moving founder who travels frequently. We need someone with 5+ years EA experience, ideally from a startup or VC background. Full-time, hybrid 3 days a week, $90-110k. Reports directly to the CEO. Key responsibilities: managing a complex calendar, booking travel, managing inbox, supporting board prep, running point on special projects."></textarea>
    </div>

    <div class="row-2" style="margin-top:4px;">
      <div class="field" style="margin-bottom:0;">
        <label>Company name <span style="font-weight:400;text-transform:none;font-size:0.78rem;">(optional)</span></label>
        <input type="text" id="company-name" placeholder="e.g. Acme Inc." />
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Job title <span style="font-weight:400;text-transform:none;font-size:0.78rem;">(optional)</span></label>
        <input type="text" id="job-title" placeholder="e.g. Executive Assistant" />
      </div>
    </div>

    <button class="btn-generate" id="generate-btn" onclick="generatePosting()">Write my job posting →</button>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Writing your job posting…</p>
  </div>

  <!-- Output -->
  <div class="output-section" id="output-section">
    <div class="output-box" id="output-box"></div>
    <div class="output-actions">
      <button class="btn-copy" id="copy-btn" onclick="copyOutput()">Copy to clipboard</button>
      <button class="btn-print" onclick="window.print()">⬇ Save / Print PDF</button>
      <button class="btn-reset" onclick="resetForm()">Start over</button>
    </div>
  </div>

  <div class="back-link"><a href="index.html">← Back to GetCarrieAI</a></div>
</div>

<script>
  async function generatePosting() {
    const brainDump = document.getElementById('brain-dump').value.trim();
    if (!brainDump) {
      alert('Tell me about the role first.');
      return;
    }

    const company = document.getElementById('company-name').value.trim();
    const title = document.getElementById('job-title').value.trim();

    const extras = [
      company ? `Company: ${company}` : '',
      title ? `Job title: ${title}` : ''
    ].filter(Boolean).join('\n');

    const userMessage = extras ? `${brainDump}\n\n${extras}` : brainDump;

    document.getElementById('input-card').style.display = 'none';
    document.getElementById('loading').classList.add('visible');
    document.getElementById('generate-btn').disabled = true;

    try {
      const response = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          max_tokens: 1200,
          system: `You are an expert EA and recruiting professional who writes compelling, honest job postings.

Given a description of a role, write a complete, polished job posting formatted with plain text (no markdown, no asterisks, no pound signs). Use the following format:

[JOB TITLE IN ALL CAPS]
[Company] · [Employment type] · [Location]

─────────────────────────────────────────────
ABOUT US
─────────────────────────────────────────────
[2-3 sentences about the company — warm, real, not corporate jargon]

─────────────────────────────────────────────
THE ROLE
─────────────────────────────────────────────
[2-3 sentences about the role — what they'll own, who they'll work with, why it matters]

─────────────────────────────────────────────
WHAT YOU'LL DO
─────────────────────────────────────────────
• [responsibility]
• [responsibility]
• [responsibility]
(4-6 bullet points)

─────────────────────────────────────────────
WHAT WE'RE LOOKING FOR
─────────────────────────────────────────────
• [requirement]
• [requirement]
(4-6 must-haves, honest and specific)

─────────────────────────────────────────────
NICE TO HAVE
─────────────────────────────────────────────
• [nice to have]
(2-3 genuinely optional items)

─────────────────────────────────────────────
COMPENSATION & BENEFITS
─────────────────────────────────────────────
[Salary range if mentioned, plus any benefits]

─────────────────────────────────────────────
HOW TO APPLY
─────────────────────────────────────────────
[Application instructions if mentioned, otherwise write: Apply via LinkedIn or send your resume to [email] — no cover letter required. Tell us why this role, why now.]

─────────────────────────────────────────────
Generated by GetCarrieAI.com

Rules:
- Write like a human, not a corporate HR template
- Be specific and honest — no filler phrases like "fast-paced environment" or "rockstar"
- If salary wasn't mentioned, omit the compensation section
- Keep it to what was described — don't invent details that weren't given
- Use plain text only, no markdown formatting`,
          messages: [{ role: 'user', content: userMessage }]
        })
      });

      const data = await response.json();
      if (data.content) {
        document.getElementById('output-box').textContent = data.content;
        document.getElementById('loading').classList.remove('visible');
        document.getElementById('output-section').classList.add('visible');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        throw new Error(data.error || 'Something went wrong');
      }

    } catch (err) {
      document.getElementById('loading').classList.remove('visible');
      document.getElementById('input-card').style.display = 'block';
      document.getElementById('generate-btn').disabled = false;
      alert('Something went wrong. Please try again.');
      console.error(err);
    }
  }

  function copyOutput() {
    const text = document.getElementById('output-box').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy to clipboard'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function resetForm() {
    document.getElementById('output-section').classList.remove('visible');
    document.getElementById('output-box').textContent = '';
    document.getElementById('input-card').style.display = 'block';
    document.getElementById('generate-btn').disabled = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
